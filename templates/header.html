<header class="a11y-header-bar">
  <div class="app-title-group">
    <h1>{{title}}</h1>
    <span class="subhead">An interactive learning tool for Emeritus Institute students.</span>
  </div>
  <div class="a11y-controls" role="region" aria-label="Accessibility settings">
    <div class="font-slider-container">
      <label for="font-scaler-slider" class="control-item">Text Size:</label>
      <input type="range" id="font-scaler-slider" min="0.9" max="1.4" step="0.01" value="1" aria-label="Adjust text size scale">
      <output id="font-size-indicator" for="font-scaler-slider">100%</output>
    </div>
    <button type="button" class="btn-a11y active" id="btn-font-normal" data-font-scale="1" aria-pressed="true">Normal</button>
    <button type="button" class="btn-a11y" id="btn-font-large" data-font-scale="1.18" aria-pressed="false">Large</button>
    <button type="button" class="btn-a11y" id="btn-font-xlarge" data-font-scale="1.35" aria-pressed="false">Extra Large</button>
    <div class="control-item theme-control">
      <label for="theme-select" class="theme-label">Contrast Theme:</label>
      <select id="theme-select" class="btn-a11y">
        <option value="default" data-mobile-label="Light theme">Default Light</option>
        <option value="dark" data-mobile-label="Dark theme">High Contrast Dark</option>
        <option value="high-contrast-light" data-mobile-label="B&amp;W theme">High Contrast B&amp;W</option>
      </select>
    </div>
  </div>
</header>
